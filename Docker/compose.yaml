# run.shを使用してcomposeを起動する。
# run.shは、UIDとGIDを設定、ユーザー所有のホスト鍵を適切にコピー
# trap EXITで、コピーした鍵を削除する。
---
services:
  # 1. ブローカー (Mosquitto)
  mosquitto:
    image: eclipse-mosquitto
    container_name: mqtt_broker
    ports:
      - "8883:8883"
      - "8333:8333"
      - "8083:8083"
      # - "1883:1883"
      # - "9001:9001" # WSS用ポート
    working_dir: /mosquitto
    volumes:
      - ${RootDir:-.}/Mosquitto/config:/mosquitto/config
      # - ${RootDir:-.}/Mosquitto/data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
      - ${CertsDir:-../../localcerts}/localhost.pem:/mosquitto/certs/localcerts.pem:ro
      - ${CertsDir:-../../localcerts}/localhost-key.pem:/mosquitto/certs/localcerts-key.pem:ro
      - ${CADir:-../Mosquitto/certs/}/rootCA.pem:/mosquitto/certs/rootCA.pem:ro
    command: sh -c "mosquitto -c ./config/mosquitto-container.conf"
    user: "${UID:-1000}:${GID:-1000}" # run.shでUIDとGIDを設定している場合はそれを使用
    healthcheck:
      # test: ["CMD-SHELL", "nc -z -w 3 localhost 8333 || exit 1"]
      # test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 1883 -t 'health/check' -E || exit 1"]
      # ncによるhealthcheckは(動作するが)必ずしも正確ではない。
      # mosquitto_subによるhealthcheckは、そのコマンド起動時に毎回subscription登録するためログが煩い
      # mosquitto_pubによるhealthcheckは、mqtt_loggerに出力されて煩いが上記2種類よりはマシ
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -p 1883 -t 'health/check' -m 'ping' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s

  # 【追加】ログ・トピック監視専用のコンテナ
  mqtt_logger:
    profiles:
      - skip-default
    image: eclipse-mosquitto
    depends_on:
      mosquitto:
        condition: service_healthy
    command: mosquitto_sub -h mqtt_broker -p 1883 -t "#" -F "%t"
    restart: always

  # 2. Python MQTT クライアント 
  python-client:
    image: python:3.11-slim
    container_name: metawork_mqtt_manager
    volumes:
      - ${RootDir:-.}:/app
      - ${CADir:-../Mosquitto/certs/}/rootCA.pem:/app/rootCA.pem:ro
      - /etc/passwd:/etc/passwd:ro
      - /etc/group:/etc/group:ro
      - ${HOME}
    working_dir: /app
    depends_on:
      mosquitto:
        condition: service_healthy
    # command: sh -c "[ -f requirements.txt ] && pip install -r requirements.txt; python ....
    # paho-mqtt以外install不要なのでrequirementsやインストール先のvolumeマウント化は省略
    # 同じdocker bridge network内なので暗号化不要だが今後の展開やCA確認のためwss接続
    command: ["-c", "pip install paho-mqtt && python3 MetaworkMQTT.py --wss --host mosquitto" ]
    entrypoint: /usr/bin/bash
    # 現在は、client.tls_set(cert_reqs=0)としてあるのでmosquittoの証明書を使用しないが...
    # localhostでもMan-in-the-Middle攻撃を防ぐために、証明書を使用するように変更することを推奨。
    # user: "${UID:-1000}:${GID:-1000}"
    environment:
      - MQTT_BROKER_HOST=host.docker.internal
      - PYTHONUNBUFFERED=1

  # 3. Next.js 開発サーバー
  nextjs-dev:
    profiles:
      - dev-server
    image: node:22-alpine
    container_name: nextjs_dev_https_server
    ports:
      - "3000:3000"
      - "5173:5173"
    volumes:
      - ./entrypoint-for-pnpm.sh:/entrypoint-for-pnpm.sh:ro
      - ${NEXT_PKG:-..}:/mnt/ro_base:ro
      - type: tmpfs
        target: /mnt/rw_storage
      # - dev-server-node-modules:/app/node_modules
      # - /app/.next
      # - /app/.pnpm-store
    working_dir: /app
    # 
    privileged: true
    entrypoint: /entrypoint-for-pnpm.sh
    command: sh -c "corepack enable pnpm && pnpm install --no-frozen-lockfile && ${NpmCmd:-pnpm} ${DevCmd:-dev}"
    # user: "${UID:-1000}:${GID:-1000}" mountを使用するためroot
    environment:
      - WATCHPACK_POLLING=true
      - pnpm_config_block_exotic_subdeps=false
      - pnpm_config_minimum_release_age=0
      - pnpm_config_dangerously_allow_all_builds=true
      - CI=true

volumes:
  # dev-server-node-modules:
  mosquitto-log:
